<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mbarara University of Science and Technology</title>

    <link rel="stylesheet" href="application.css">

  </head>
  <body>
    <header class="portal-header">
      <img class="campus-logo" src="campus_logo.png" alt="MUST logo">
      <h1>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
      <span class="intro-label">Online Application Portal</span>
    </header>
    <form class="card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to access your application dashboard</p>

      <label for="email-address">Email Address</label>
      <div class="input-group">
        <input type="email" id="email-address" placeholder="name@example.com" required>
      </div>

      <label for="password">Password</label>
      <div class="input-group">
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary">
        Sign In
      </button>

      <a href=""> Forgot your password?</a>

      <div class="divider">New to the portal?</div>

      <div class="btn-row">
        <a class="btn btn-outline-blue" href="createAccount.html"> Create Account
        </a>
        <a class="btn btn-outline-grey" href="#">
           How to Apply
        </a>
      </div>
    </form>
  </body>
</html>
