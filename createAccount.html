<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | MUST</title>

    <link rel="stylesheet" href="application.css">
    
  </head>
  <body>

    <form class="card card-wide">

      <div class="card-top">
        <div>
          <h2>Create Account</h2>
          <p class="subtitle">Provide your details to receive a temporary password.</p>
        </div>
      </div>

      <label for="surname">Surname</label>
      <div class="input-group">
        <input type="text" id="surname" placeholder="Surname" required>
      </div>

      <label for="other-names">Other Names</label>
      <div class="input-group">
        <input type="text" id="other-names" placeholder="Other names" required>
      </div>

      <label for="contact">Phone Number</label>
      <div class="phone-row">
        <select aria-label="Country code">
          <option>Uganda (+256)</option>
          <option>Kenya (+254)</option>
          <option>Tanzania (+255)</option>
          <option>Rwanda (+250)</option>
        </select>
        <div class="input-group">
          <input type="tel" id="contact" placeholder="0770000000" required>
        </div>
      </div>
      <p class="hint">Use an active phone number to receive notifications.</p>

      <label for="email-address">Email Address</label>
      <div class="input-group">
        <input type="email" id="email-address" placeholder="myemail@gmail.com" required>
      </div>
      <a class="link-right" href="#">Don't have an email? Click to create</a>

      <div class="card-footer">
        <a class="btn btn-outline-grey" href="application.html">Close</a>
        <button type="submit" class="btn btn-blue">
           Create Account
        </button>
      </div>

    </form>

  </body>
</html>
